name: RSpec

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    # Rails 8.2 tracks rails/rails main until 8.2.0 ships.
    continue-on-error: ${{ matrix.gemfile == 'gemfiles/rails_8.2.gemfile' }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "3.3"
          - "3.2"
        gemfile:
          - gemfiles/rails_8.2.gemfile
          - gemfiles/rails_8.1.gemfile
          - gemfiles/rails_8.0.gemfile
          - gemfiles/rails_7.2.gemfile
        exclude:
          # Rails 8.2 requires Ruby >= 3.3.1.
          - ruby: "3.2"
            gemfile: gemfiles/rails_8.2.gemfile

    env:
      BUNDLE_GEMFILE: ${{ format('{0}/{1}', github.workspace, matrix.gemfile) }}
      BUNDLE_PATH: ${{ format('{0}/vendor/bundle', github.workspace) }}
      BUNDLE_DEPLOYMENT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RSpec
        run: bundle exec rspec
